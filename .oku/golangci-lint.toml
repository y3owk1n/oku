# A local manifest, because oku cannot list this repo's releases yet.
[package]
name = "golangci-lint"
description = "Runs many Go linters in one pass"
homepage = "https://github.com/golangci/golangci-lint"
license = "GPL-3.0-or-later"

[version]
value = "2.12.2"

[[artifact]]
url = "https://github.com/golangci/golangci-lint/releases/download/v{{version}}/golangci-lint-{{version}}-{{os}}-{{arch}}.tar.gz"
sha256_url = "https://github.com/golangci/golangci-lint/releases/download/v{{version}}/golangci-lint-{{version}}-checksums.txt"
strip = 1
bin = ["golangci-lint"]
