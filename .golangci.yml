version: "2"
linters:
  exclusions:
    # A copy of XZ Embedded's Go port, kept as it is upstream.
    paths:
      - internal/xz
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (*os.Root).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
        - os.RemoveAll
