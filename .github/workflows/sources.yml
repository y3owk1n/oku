name: sources

# Once a day, the oku of main asks each outside source it reads for a real
# package: forges, registries, the Homebrew API, the aqua registry, Scoop and
# winget. A failure means a source changed its format or its address, or is
# down, and the run opens an issue that names it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sources
  cancel-in-progress: true

jobs:
  check:
    # Casks and Sparkle feeds resolve on macOS only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Ask each source for a package
        # Anonymous GitHub API calls from a shared runner are rate limited.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/sources.sh
      - name: Open an issue, or add to the open one
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="A source that oku reads has changed"
          body="$(mktemp)"
          {
            echo "The [sources check](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) failed for:"
            echo
            cat "$RUNNER_TEMP/oku-sources/report.md"
          } >"$body"

          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number')"

          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          fi
