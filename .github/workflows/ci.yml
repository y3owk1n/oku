name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Live test on Linux
        if: runner.os == 'Linux'
        # The dconf service needs a D-Bus session, which the script starts itself.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dconf-cli dconf-service dbus
          .github/scripts/live-linux.sh
      - name: Live test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        # Anonymous GitHub API calls from a shared runner are rate limited.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/live-windows.ps1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
