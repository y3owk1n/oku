name: ci

# A pull request runs every check, and main only takes merged pull requests, so
# a push to main runs nothing more here. The release pull request only bumps
# the version and the changelog, so every job skips it. A skipped job counts as
# passed for a required check, where a path filter on the whole workflow would
# leave the checks pending and block the merge.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action installs the tools of oku.toml with the nightly oku, so a
      # broken commit cannot break the tools that test it.
      - uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: nightly
      - run: go vet ./...
      - run: go test ./...
      - name: Live test on Linux
        if: runner.os == 'Linux'
        # The dconf service needs a D-Bus session, which the script starts itself.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dconf-cli dconf-service dbus
          .github/scripts/live-linux.sh

  action:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    # The action in action.yml, with the oku of this commit on PATH, which the
    # action then uses in place of a release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build oku
        shell: bash
        run: |
          exe=oku
          [ "$RUNNER_OS" = Windows ] && exe=oku.exe
          go build -o "$RUNNER_TEMP/oku-bin/$exe" ./cmd/oku
          echo "$RUNNER_TEMP/oku-bin" >> "$GITHUB_PATH"
      - uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path: .github/action-test
          cache: "false"
      - name: "B263: a later step runs the project's tools"
        shell: bash
        run: fd --version
      # oku sync refuses the extra words, so the step fails. Had the action run
      # args as shell code, the file would exist.
      - uses: ./
        id: hostile
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path: .github/action-test
          cache: "false"
          args: "--locked $(touch b404-ran) `touch b404-ran`"
      - name: "B404: the action splits args and runs none of it as shell code"
        shell: bash
        run: |
          test "${{ steps.hostile.outcome }}" = failure
          test ! -e b404-ran && test ! -e .github/action-test/b404-ran

  action-tag:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    # The action used by a release tag, with no oku on PATH, installs that
    # release. A local action in a directory named like the tag stands in for
    # y3owk1n/oku@v0.6.0.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Put the action in a directory named like a tag
        shell: bash
        run: mkdir -p .github/v0.6.0 && cp action.yml install.sh install.ps1 .github/v0.6.0/
      - uses: ./.github/v0.6.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path: .github/action-test
          cache: "false"
      - name: "B263: the action installed the release of its tag"
        shell: bash
        run: oku --version | grep -F 0.6.0

  lint:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    # Files with a build tag for another OS are only linted under that GOOS, so
    # one run per OS, all on the Linux runner.
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: nightly
      - run: golangci-lint run
        env:
          GOOS: ${{ matrix.goos }}
