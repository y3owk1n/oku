name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The action installs the tools of oku.toml with the nightly oku, so a
      # broken commit cannot break the tools that test it.
      - uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: nightly
      - run: go vet ./...
      - run: go test ./...
      - name: Live test on Linux
        if: runner.os == 'Linux'
        # The dconf service needs a D-Bus session, which the script starts itself.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dconf-cli dconf-service dbus
          .github/scripts/live-linux.sh
      - name: Live test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        # Anonymous GitHub API calls from a shared runner are rate limited.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/live-windows.ps1

  action:
    # The action in action.yml, with the oku of this commit on PATH, which the
    # action then uses in place of a release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build oku
        shell: bash
        run: |
          exe=oku
          [ "$RUNNER_OS" = Windows ] && exe=oku.exe
          go build -o "$RUNNER_TEMP/oku-bin/$exe" ./cmd/oku
          echo "$RUNNER_TEMP/oku-bin" >> "$GITHUB_PATH"
      - uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path: .github/action-test
          cache: "false"
      - name: A later step runs the project's tools
        shell: bash
        run: fd --version

  lint:
    # Files with a build tag for another OS are only linted under that GOOS, so
    # one run per OS, all on the Linux runner.
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: nightly
      - run: golangci-lint run
        env:
          GOOS: ${{ matrix.goos }}
