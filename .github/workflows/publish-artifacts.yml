name: publish-artifacts

# release-please makes the tag and the release. This workflow builds the files
# for it, signs them and uploads them.
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      upload_token:
        required: false
      minisign_secret_key:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build a static binary for every OS and CPU
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="oku-$os-$arch"
            if [ "$os" = windows ]; then name="$name.exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/$name" ./cmd/oku
          done
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum -- * > checksums.txt)

      # "oku self update" refuses a file that the release key did not sign, so
      # nobody could update from a release that was made without the secret.
      - name: Sign every file with the release key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.minisign_secret_key }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "the MINISIGN_SECRET_KEY secret is not set" >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/release.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for file in dist/*; do
            minisign -S -s "$key" -m "$file" -t "oku $RELEASE_TAG"
          done
          rm -f "$key"

      - name: Upload the files to the release
        env:
          GH_TOKEN: ${{ secrets.upload_token || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
