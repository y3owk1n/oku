name: publish-artifacts

# release-please makes the tag and the release, and nightly.yml makes the
# nightly one. This workflow builds the files for it, signs them and uploads
# them.
on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      # The commit to build. Default is the tag. nightly.yml builds before it
      # moves the tag, so it names the commit.
      ref:
        required: false
        type: string
        default: ""
      # The version the binaries report. Default is the tag without its "v".
      version_override:
        required: false
        type: string
        default: ""
    secrets:
      upload_token:
        required: false
      minisign_secret_key:
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.release_tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build a static binary for every OS and CPU
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          version="${VERSION_OVERRIDE:-${RELEASE_TAG#v}}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="oku-$os-$arch"
            if [ "$os" = windows ]; then name="$name.exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/$name" ./cmd/oku
          done
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum -- * > checksums.txt)

      # "oku self update" refuses a file that the release key did not sign, so
      # nobody could update from a release that was made without the secret.
      # Every nightly is "nightly", so the checksums of a nightly are signed
      # with its full version, such as "oku nightly-20260927084032-b796323",
      # and self update refuses a nightly older than the one it runs.
      - name: Sign every file with the release key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.minisign_secret_key }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "the MINISIGN_SECRET_KEY secret is not set" >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/release.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for file in dist/*; do
            comment="oku $RELEASE_TAG"
            if [ "$RELEASE_TAG" = nightly ] && [ "$(basename "$file")" = checksums.txt ]; then
              comment="oku $VERSION_OVERRIDE"
            fi
            minisign -S -s "$key" -m "$file" -t "$comment"
          done
          rm -f "$key"

      # gh release upload reads the file list embedded in the release. GitHub
      # can serve a stale copy of that list, with files it already deleted,
      # and --clobber then fails on a 404. /releases/{id}/assets lists the
      # files that exist. Each file goes up as <name>.next first, and then
      # takes the place of the old one with a delete and a rename, so the
      # nightly holds a mix of two builds for seconds, not for the whole upload.
      # checksums.txt goes last, and the install scripts try again meanwhile.
      - name: Upload the files to the release
        env:
          GH_TOKEN: ${{ secrets.upload_token || github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .id)"
          assets() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | "\(.id) \(.name)"'
          }

          # A run that failed partway may have left files under the next name.
          assets | while read -r asset name; do
            case "$name" in *.next) gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset" ;; esac
          done

          # Names are passed to gh as a field, which gh encodes into the query
          # string.
          for file in dist/*; do
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets" \
              -f name="$(basename "$file").next" -H "Content-Type: application/octet-stream" \
              --input "$file" --silent
          done

          assets > assets.txt
          for name in $(cd dist && ls | grep -v '^checksums\.txt') checksums.txt.minisig checksums.txt; do
            [ -f "dist/$name" ] || continue
            old="$(awk -v n="$name" '$2 == n { print $1 }' assets.txt)"
            new="$(awk -v n="$name.next" '$2 == n { print $1 }' assets.txt)"
            if [ -n "$old" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new" -f name="$name" --silent
          done
