name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A personal token lets CI run on the release pull request. Without the
      # secret the job token still opens the pull request and makes the release.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || github.token }}

  publish-release-artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish-artifacts.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      upload_token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
      minisign_secret_key: ${{ secrets.MINISIGN_SECRET_KEY }}
