name: oku
description: Install oku and the tools that an oku.toml and its oku.lock pin, and put them on PATH.
author: y3owk1n
branding:
  icon: package
  color: gray-dark

inputs:
  version:
    description: The oku release to install, such as v0.6.0 or nightly. Empty installs the release of the action's own tag, as in y3owk1n/oku@v1.2.3, and the newest release otherwise. An oku already on PATH is used as it is.
    default: ""
  path:
    description: The directory that holds the oku.toml to sync. Its lock must pin this runner's platform.
    default: "."
  args:
    description: What oku sync gets besides --yes.
    default: "--locked"
  cache:
    description: Keep the store and the downloads between runs, keyed by the oku.lock.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install oku
      if: runner.os != 'Windows'
      shell: bash
      env:
        OKU_VERSION: ${{ inputs.version }}
      run: |
        # When a workflow uses the action by a release tag, as in
        # y3owk1n/oku@v1.2.3, the action installs that release, so a bump of the
        # tag moves both.
        ref="$(basename "$GITHUB_ACTION_PATH")"
        if [ -z "$OKU_VERSION" ] && printf '%s' "$ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          export OKU_VERSION="$ref"
        fi
        if ! command -v oku >/dev/null 2>&1; then
          # The install script of the action's own checkout checks the release's
          # minisign signature with a minisign pinned here by its sha256.
          # minisign has an arm64 macOS build only, so an Intel Mac installs it
          # with Homebrew.
          ms="$RUNNER_TEMP/oku-minisign"
          mkdir -p "$ms"
          from=https://github.com/jedisct1/minisign/releases/download/0.12
          case "$RUNNER_OS-$(uname -m)" in
          Linux-*)
            curl -fsSL --proto '=https' "$from/minisign-0.12-linux.tar.gz" -o "$ms/minisign.tar.gz"
            echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $ms/minisign.tar.gz" | sha256sum -c --quiet
            tar --warning=no-unknown-keyword -xzf "$ms/minisign.tar.gz" -C "$ms"
            PATH="$ms/minisign-linux/$(uname -m):$PATH"
            ;;
          macOS-arm64)
            curl -fsSL --proto '=https' "$from/minisign-0.12-macos.zip" -o "$ms/minisign.zip"
            echo "89000b19535765f9cffc65a65d64a820f433ef6db8020667f7570e06bf6aac63  $ms/minisign.zip" | shasum -a 256 -c --quiet
            unzip -q "$ms/minisign.zip" minisign -d "$ms"
            PATH="$ms:$PATH"
            ;;
          *) HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet minisign ;;
          esac
          OKU_REQUIRE_SIGNATURE=1 sh "$GITHUB_ACTION_PATH/install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: Install oku
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        OKU_VERSION: ${{ inputs.version }}
      run: |
        $ref = Split-Path -Leaf $env:GITHUB_ACTION_PATH
        if (-not $env:OKU_VERSION -and $ref -match '^v\d+\.\d+\.\d+$') { $env:OKU_VERSION = $ref }
        if (-not (Get-Command oku -ErrorAction SilentlyContinue)) {
          # The install script of the action's own checkout checks the release's
          # minisign signature with a minisign pinned here by its sha256.
          $ms = Join-Path $env:RUNNER_TEMP 'oku-minisign'
          New-Item -ItemType Directory -Force $ms | Out-Null
          $zip = Join-Path $ms 'minisign.zip'
          Invoke-WebRequest https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip -OutFile $zip -UseBasicParsing
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '37B600344E20C19314B2E82813DB2BFDCC408B77B876F7727889DBD46D539479') {
            throw 'minisign-0.12-win64.zip does not match its pinned sha256'
          }
          Expand-Archive $zip -DestinationPath $ms
          $cpu = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $env:Path = (Join-Path $ms "minisign-win64\$cpu") + ';' + $env:Path
          $env:OKU_REQUIRE_SIGNATURE = '1'
          & (Join-Path $env:GITHUB_ACTION_PATH 'install.ps1')
          Join-Path $env:LOCALAPPDATA 'oku\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        }

    # The store only grows, and oku sync checks what it takes from it, so an
    # older store is a safe start for a newer lock.
    - name: Cache the store
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.local/share/oku/store
          ~/.cache/oku/downloads
          ~/AppData/Local/oku/store
          ~/AppData/Local/oku/cache/downloads
        key: oku-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/oku.lock', inputs.path)) }}
        restore-keys: oku-${{ runner.os }}-${{ runner.arch }}-

    # The shell hook would put a project's tools on PATH at each prompt. A job
    # has no prompt, so this step keeps what oku env changes for later steps.
    - name: Sync
      if: runner.os != 'Windows'
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        OKU_ARGS: ${{ inputs.args }}
      run: |
        oku="$(command -v oku || echo "$HOME/.local/bin/oku")"
        # The step splits the arguments on spaces. It runs none of them as code
        # and expands none of them as a glob.
        set -f
        # shellcheck disable=SC2086
        "$oku" sync --yes $OKU_ARGS
        set +f
        echo "${XDG_DATA_HOME:-$HOME/.local/share}/oku/profiles/global/current/bin" >> "$GITHUB_PATH"
        [ -f oku.toml ] || exit 0
        "$oku" allow
        before="$PATH"
        env | sort > "$RUNNER_TEMP/oku-env-before"
        eval "$("$oku" env --shell bash)"
        IFS=: read -ra entries <<< "$PATH"
        for entry in "${entries[@]}"; do
          case ":$before:" in *":$entry:"*) ;; *) echo "$entry" >> "$GITHUB_PATH" ;; esac
        done
        env | sort | comm -13 "$RUNNER_TEMP/oku-env-before" - | grep -v '^PATH=' >> "$GITHUB_ENV" || true

    - name: Sync
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: ${{ inputs.path }}
      env:
        OKU_ARGS: ${{ inputs.args }}
      run: |
        $oku = (Get-Command oku -ErrorAction SilentlyContinue).Source
        if (-not $oku) { $oku = Join-Path $env:LOCALAPPDATA 'oku\bin\oku.exe' }
        # The step splits the arguments on spaces and runs none of them as code.
        $okuArgs = @($env:OKU_ARGS -split '\s+' | Where-Object { $_ })
        & $oku sync --yes @okuArgs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $data = if ($env:XDG_DATA_HOME) { Join-Path $env:XDG_DATA_HOME 'oku' } else { Join-Path $env:LOCALAPPDATA 'oku' }
        Join-Path $data 'profiles\global\current\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        if (-not (Test-Path oku.toml)) { exit 0 }
        & $oku allow
        $before = @{}
        Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
        Invoke-Expression ((& $oku env --shell pwsh) -join [Environment]::NewLine)
        $had = $before['Path'] -split ';'
        foreach ($entry in ($env:Path -split ';')) {
          if ($entry -and $had -notcontains $entry) { $entry | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
        }
        foreach ($var in Get-ChildItem Env:) {
          if ($var.Name -ne 'Path' -and $before[$var.Name] -ne $var.Value) {
            "$($var.Name)=$($var.Value)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
        }
